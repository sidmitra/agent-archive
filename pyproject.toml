[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-archive"
version = "0.1.1"
description = "Archive and browse agentic coding sessions"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12.0",
    "pydantic>=2.7.0",
    "mkdocs>=1.6.0",
    "mkdocs-dracula-theme>=1.0.0",
    "pyyaml>=6.0"
]

[project.urls]
Homepage = "https://github.com/sidmitra/agent-archive"
Repository = "https://github.com/sidmitra/agent-archive"
Issues = "https://github.com/sidmitra/agent-archive/issues"

[project.scripts]
agent-archive = "agent_archive.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0"
]
